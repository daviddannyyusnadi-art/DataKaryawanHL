<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Registrasi Karyawan</title>
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#14212b;--mut:#5d6b77;--line:#d3dce3;--pri:#0f5c7a;--pri-ink:#fff;--err:#b3261e;--ok:#1b7a4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0f171d;--card:#18232b;--ink:#e8eef2;--mut:#93a3af;--line:#2b3a45;--pri:#4fb3d9;--pri-ink:#06222e;--err:#ff8a80;--ok:#6fd49c}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;z-index:5}
header::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
h1{font-size:17px;margin:0 0 2px}.sub,.hint{color:var(--mut);font-size:13px}.hint{margin-top:4px;font-size:12.5px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
main{max-width:560px;margin:0 auto;padding:16px}
h2{font-size:20px;margin:4px 0 12px}h3{font-size:15px;margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.f{margin-bottom:14px}label{display:block;font-size:14px;font-weight:500;margin-bottom:5px}label .r{color:var(--err)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px;min-height:48px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 45%,transparent);border-color:var(--pri)}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--err)}
.msg{color:var(--err);font-size:13px;margin-top:4px;display:none}.f.bad .msg{display:block}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.up{border:1.5px dashed var(--line);border-radius:10px;padding:12px}.up img{max-width:100%;max-height:140px;border-radius:8px;display:block;margin-top:8px}.up .nm{font-size:13px;color:var(--ok);margin-top:6px;word-break:break-all}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:5}
nav button{flex:1;min-height:50px;border-radius:12px;font:inherit;font-weight:700;border:0;cursor:pointer}
#back{background:var(--bg);color:var(--ink);flex:0 0 32%}#next{background:var(--pri);color:var(--pri-ink)}#next:disabled{opacity:.6}
.sum{width:100%;border-collapse:collapse;font-size:14px}.sum td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}.sum td:first-child{color:var(--mut);width:42%;padding-right:8px}
.done{text-align:center;padding:36px 8px}.done b.t{display:block;font-size:22px;margin-bottom:8px;color:var(--ok)}
.note{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13.5px;margin:14px 0;text-align:left}
.btnl{display:inline-block;margin-top:10px;padding:13px 20px;border-radius:12px;background:var(--pri);color:var(--pri-ink);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<header><h1>Registrasi Karyawan</h1><div class="sub" id="stepLbl"></div><div class="bar"><i id="prog"></i></div></header>
<main id="app"></main>
<nav id="nav"><button id="back" type="button">Kembali</button><button id="next" type="button">Lanjut</button></nav>
<script>
const OPT={kawin:["Belum Menikah","Menikah","Cerai Hidup","Cerai Mati"],jk:["Laki-laki","Perempuan"],agama:["Islam","Kristen Protestan","Katolik","Hindu","Buddha","Konghucu","Lainnya"]};
// [id, label, type, extra]  t teks, e email, d tanggal, n angka, s pilihan, a area teks
const S=[
 {t:"Data KTP dan email",note:"Cukup isi data seperti di KTP, email, serta foto KTP dan ijazah. Data lain (KK, keluarga, kontak, rekening, dll.) bisa dilengkapi nanti setelah mendaftar.",f:[
  ["email","Email Address","e"],["nik","NIK (sesuai KTP)","n",16],["nama","Nama lengkap sesuai KTP","t"],["tmpLahir","Tempat lahir","t"],["tglLahir","Tanggal lahir","d"],
  ["jk","Jenis kelamin","s","jk"],["kawin","Status perkawinan","s","kawin"],["agama","Agama","s","agama"]],addr:1},
 {t:"Unggah dokumen",up:[["fKtp","Foto KTP"],["fIjz","Ijazah terakhir (foto atau PDF)"]]},
 {t:"Periksa dan kirim",review:1}];
const ADDR=[["alamat","Alamat sesuai KTP","a"],["rt","RT","n",3],["rw","RW","n",3],["kel","Kelurahan / desa","t"],["kec","Kecamatan","t"],["kota","Kota / kabupaten","t"],["prov","Provinsi","t"]];
let D={},files={},step=0,sent=false;
const $=s=>document.querySelector(s),app=$("#app");
try{const x=JSON.parse(localStorage.getItem("reg_draft2")||"null");if(x){D=x.D||{};step=Math.min(x.step||0,S.length-1)}}catch(e){}
const save=()=>{try{localStorage.setItem("reg_draft2",JSON.stringify({D,step}))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const box=k=>document.querySelector(`[data-f="${k}"]`);

function field(id,label,type,extra,pre=""){
 const k=pre+id,v=D[k]??"";let inp;
 if(type==="s")inp=`<select data-k="${k}"><option value="">Pilih…</option>${OPT[extra].map(o=>`<option${o===v?" selected":""}>${o}</option>`).join("")}</select>`;
 else if(type==="a")inp=`<textarea rows="3" data-k="${k}">${esc(v)}</textarea>`;
 else{const m={e:'type="email" inputmode="email" autocomplete="email"',d:'type="date"',n:'type="text" inputmode="numeric"',t:'type="text"'}[type];
  inp=`<input ${m} data-k="${k}" data-ty="${type}" ${type==="n"&&extra?`maxlength="${extra}"`:""} value="${esc(v)}">`}
 return `<div class="f" data-f="${k}"><label>${label} <span class="r">*</span></label>${inp}<div class="msg"></div></div>`}

function render(){
 const s=S[step];let h=`<h2>${s.t}</h2>`;
 if(s.note)h+=`<div class="note" style="margin-top:0">${s.note}</div>`;
 if(s.f)h+=s.f.map(f=>field(...f)).join("");
 if(s.addr)h+=`<h3>Alamat sesuai KTP</h3>`+ADDR.map(a=>field(a[0],a[1],a[2],a[3],"ktp_")).join("");
 if(s.up){h+=`<div class="hint" style="margin-bottom:12px">Foto atau PDF. Foto otomatis dikecilkan agar hemat kuota. Maksimal 3,5 MB untuk PDF.</div>`+s.up.map(u=>`<div class="f" data-f="${u[0]}"><label>${u[1]} <span class="r">*</span></label><div class="up"><input type="file" accept="image/*,.pdf" data-file="${u[0]}"><div class="pv"></div></div><div class="msg"></div></div>`).join("")}
 if(s.review&&!sent)h+=`<table class="sum">${summary()}</table><div class="note">Pastikan data sudah benar. Setelah dikirim, perubahan data KTP harus lewat HRD.</div>`;
 app.innerHTML=h;
 if(s.up)for(const k in files)showPrev(k);
 $("#prog").style.width=Math.min(((step+(sent?1:0))/(S.length-1))*100,100)+"%";
 $("#stepLbl").textContent=`Langkah ${step+1} dari ${S.length} · ${s.t}`;
 $("#back").style.visibility=step&&!sent?"visible":"hidden";
 $("#next").textContent=step===S.length-1?"Kirim pendaftaran":"Lanjut";
 window.scrollTo(0,0);save()}

function summary(){
 const rows=[];S[0].f.forEach(f=>{if(D[f[0]])rows.push([f[1],D[f[0]]])});
 rows.push(["Alamat KTP",[D.ktp_alamat,"RT "+D.ktp_rt+"/RW "+D.ktp_rw,D.ktp_kel,D.ktp_kec,D.ktp_kota,D.ktp_prov].join(", ")]);
 rows.push(["Dokumen",Object.values(files).map(f=>f.name).join(", ")]);
 return rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}

function showPrev(k){const f=files[k],b=document.querySelector(`[data-f="${k}"] .pv`);if(!b)return;b.innerHTML=(f.type.startsWith("image")?`<img src="${f.data}" alt="">`:"")+`<div class="nm">✓ ${esc(f.name)}</div>`}
function readFile(file,k){
 const done=data=>{files[k]={name:file.name,type:file.type||"application/pdf",data};showPrev(k);clr(k)};
 const r=new FileReader();
 r.onload=()=>{
  if(!file.type.startsWith("image"))return file.size>3.5e6?err(k,"Ukuran PDF maksimal 3,5 MB"):done(r.result);
  const im=new Image();im.onload=()=>{const sc=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*sc;c.height=im.height*sc;c.getContext("2d").drawImage(im,0,0,c.width,c.height);done(c.toDataURL("image/jpeg",.78))};im.src=r.result};
 r.readAsDataURL(file)}
function err(k,m){const b=box(k);if(!b)return;b.classList.add("bad");b.querySelector(".msg").textContent=m}
function clr(k){const b=box(k);if(b)b.classList.remove("bad")}
function age(v){if(!v)return 0;const b=new Date(v),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;return a}

app.addEventListener("input",e=>{const t=e.target;if(!t.dataset.k)return;let v=t.value;if(t.dataset.ty==="n"){v=v.replace(/\D/g,"");t.value=v}D[t.dataset.k]=v;clr(t.dataset.k);save()});
app.addEventListener("change",e=>{const t=e.target;if(t.dataset.k){D[t.dataset.k]=t.value;clr(t.dataset.k);save()}if(t.dataset.file&&t.files[0])readFile(t.files[0],t.dataset.file)});

function validate(){
 const s=S[step];let ok=true,first=null;const bad=(k,m)=>{err(k,m);ok=false;first=first||box(k)};
 const chk=k=>{const v=(D[k]||"").trim();if(!v)return bad(k,"Wajib diisi");
  if(k==="email"&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))bad(k,"Format email belum benar");
  if(k==="nik"&&v.length!==16)bad(k,"NIK harus 16 digit");
  if(k==="tglLahir"&&age(v)<17)bad(k,"Usia minimal 17 tahun")};
 (s.f||[]).forEach(f=>chk(f[0]));
 if(s.addr)ADDR.forEach(a=>chk("ktp_"+a[0]));
 if(s.up)s.up.forEach(u=>{if(!files[u[0]])bad(u[0],"Dokumen ini wajib diunggah")});
 if(first)first.scrollIntoView({behavior:"smooth",block:"center"});return ok}

$("#back").onclick=()=>{if(step>0){step--;render()}};
$("#next").onclick=async()=>{
 if(!validate())return;
 if(step<S.length-1){step++;return render()}
 const b=$("#next");b.disabled=true;
 try{
  const H={"Content-Type":"application/json"},ks=Object.keys(files);let i=0;
  for(const k of ks){b.textContent=`Mengunggah berkas ${++i}/${ks.length}…`;const x=files[k];
   const r=await fetch("/api/upload",{method:"POST",headers:H,body:JSON.stringify({nik:D.nik,key:k,name:x.name,type:x.type,data:x.data})});
   if(r.status===409)throw new Error("dup");if(!r.ok)throw 0}
  b.textContent="Menyimpan data…";
  const r2=await fetch("/api/register",{method:"POST",headers:H,body:JSON.stringify({...D,dikirim:new Date().toISOString(),berkas:ks.map(k=>k+": "+files[k].name)})});
  if(r2.status===409)throw new Error("dup");if(!r2.ok)throw 0;
  const nip=((await r2.json().catch(()=>({}))).nip)||"";
  sent=true;try{localStorage.removeItem("reg_draft2")}catch(e){}
  $("#nav").style.display="none";$("#prog").style.width="100%";$("#stepLbl").textContent="Selesai";
  app.innerHTML=`<div class="done"><b class="t">Pendaftaran selesai</b><p>Terima kasih, ${esc(D.nama)}.${nip?` NIP Anda: <b>${esc(nip)}</b>`:""}</p>
   <div class="note"><b>Langkah berikutnya:</b> buka halaman absensi, masuk dengan NIK dan tanggal lahir (format DDMMYYYY) sebagai kata sandi pertama, lalu buat PIN. Setelah itu pilih <b>Lengkapi data diri</b> untuk mengisi data lain (KK, keluarga, kontak, rekening, dll.) kapan saja.</div>
   <a class="btnl" href="/absen">Buka halaman absensi</a></div>`;
 }catch(e){b.disabled=false;b.textContent="Kirim pendaftaran";alert(e&&e.message==="dup"?"NIK ini sudah terdaftar. Hubungi HRD jika data perlu diubah.":"Gagal mengirim. Periksa koneksi lalu coba lagi.")}};
render();
</script>
</body>
</html>
