<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Absensi Karyawan</title>
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#14212b;--mut:#5d6b77;--line:#d3dce3;--pri:#0f5c7a;--pri-ink:#fff;--err:#b3261e;--ok:#1b7a4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0f171d;--card:#18232b;--ink:#e8eef2;--mut:#93a3af;--line:#2b3a45;--pri:#4fb3d9;--pri-ink:#06222e;--err:#ff8a80;--ok:#6fd49c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 16px}
h1{font-size:22px;margin:0 0 2px}.sub,.hint{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px 0 10px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input{width:100%;font:inherit;font-size:18px;letter-spacing:1px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:13px;min-height:52px}
input:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 45%,transparent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;min-height:56px;background:var(--pri);color:var(--pri-ink);cursor:pointer}
.btn.out{background:none;border:2px solid var(--pri);color:var(--pri)}
.btn:disabled{opacity:.5}
.msg{margin-top:14px;font-weight:600}.msg.ok{color:var(--ok)}.msg.bad{color:var(--err)}
</style>
</head>
<body>
<main>
 <h1>Absensi karyawan</h1><div class="sub" id="clk"></div>
 <div class="card">
  <label for="nik">Nomor NIK (16 digit)</label>
  <input id="nik" inputmode="numeric" maxlength="16" autocomplete="off" placeholder="3204…">
  <div class="two"><button class="btn" id="bm" type="button">Absen masuk</button><button class="btn out" id="bp" type="button">Absen pulang</button></div>
  <div id="res" role="status"></div>
 </div>
 <p class="hint">Waktu dicatat otomatis oleh server (WIB). Lokasi HP dicatat jika Anda mengizinkan.</p>
</main>
<script>
const $=s=>document.querySelector(s);
try{$("#nik").value=localStorage.getItem("nik")||""}catch(e){}
const tick=()=>{$("#clk").textContent=new Date().toLocaleString("id-ID",{timeZone:"Asia/Jakarta",weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"})+" WIB"};tick();setInterval(tick,20000);
$("#nik").oninput=e=>{e.target.value=e.target.value.replace(/\D/g,"")};
const pos=()=>new Promise(r=>{if(!navigator.geolocation)return r(null);navigator.geolocation.getCurrentPosition(p=>r({lat:p.coords.latitude,lng:p.coords.longitude}),()=>r(null),{timeout:6000,maximumAge:60000})});
async function go(aksi){
 const nik=$("#nik").value,R=$("#res");
 if(!/^\d{16}$/.test(nik)){R.className="msg bad";R.textContent="NIK harus 16 digit.";return}
 const bs=document.querySelectorAll("button");bs.forEach(b=>b.disabled=true);R.className="msg";R.textContent="Mencatat…";
 try{
  const l=await pos();
  const r=await fetch("/api/absen",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nik,aksi,...(l||{})})});
  const j=await r.json();if(!r.ok)throw new Error(j.error||"Gagal mencatat");
  try{localStorage.setItem("nik",nik)}catch(e){}
  R.className="msg ok";
  R.textContent=j.sudah?`${j.nama}, absen masuk Anda sudah tercatat pukul ${j.jam} WIB.`:`${j.nama}, absen ${aksi} tercatat pukul ${j.jam} WIB.`;
 }catch(e){R.className="msg bad";R.textContent=e.message==="Failed to fetch"?"Tidak ada koneksi. Coba lagi.":e.message}
 bs.forEach(b=>b.disabled=false);
}
$("#bm").onclick=()=>go("masuk");$("#bp").onclick=()=>go("pulang");
</script>
</body>
</html>
